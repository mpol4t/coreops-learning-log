name: Validate learning log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Reject generated and sensitive filenames
        shell: bash
        run: |
          set -euo pipefail
          tracked_bad_files="$({
            git ls-files \
              | grep -E '(^|/)(\.DS_Store|\.env($|\.)|__pycache__/|.*\.py[co]$)' \
              | grep -Ev '(^|/)\.env\.example$' \
              || true
          })"
          if [[ -n "$tracked_bad_files" ]]; then
            echo "Tracked generated or sensitive filenames found:"
            echo "$tracked_bad_files"
            exit 1
          fi

      - name: Check whitespace introduced by this change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            git show --check --format= "$CURRENT_SHA"
          else
            git diff --check "$BEFORE_SHA...$CURRENT_SHA"
          fi

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - repository-hygiene
      - python-syntax
      - python-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build Docker image
        run: |
          docker build \
            -f day-49/Blok2/Dockerfile \
            -t coreops-ci-check \
            day-49/Blok2

      - name: Verify non-root runtime and dependency
        run: |
          docker run --rm coreops-ci-check python -c \
            'import os, pathlib, psycopg; assert os.getuid() == 10001; assert not os.access("/lab/src", os.W_OK); pathlib.Path("/lab/runtime/ci-check.txt").write_text("ok"); print("dependency and permissions OK")'

      - name: Build and smoke-test final Docker lab
        run: |
          docker build -t coreops-final-check day-52/Final/docker-kismi
          docker run --rm coreops-final-check python -c \
            'import json, os, pathlib, runpy; assert os.getuid() == 10001; assert not os.access("/lab/src", os.W_OK); runpy.run_path("/lab/src/app.py", run_name="__main__"); assert json.loads(pathlib.Path("/lab/runtime/report.json").read_text()) == {"status": "ok", "total_records": 3}'

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Compile tracked Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t python_files < <(git ls-files -z -- '*.py')
          python -m py_compile "${python_files[@]}"

  python-tests:
    name: Python tests — ${{ matrix.suite.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite:
          - directory: day-42
            target: Blok1/tests
          - directory: day-42/Blok2
            target: tests
          - directory: day-47/blok3-python
            target: tests test_tmp_path_demo.py
          - directory: day-51/Blok1
            target: test_day51.py
          - directory: day-52/Blok1
            target: test_day52.py
          - directory: day-52/Final
            target: test_final.py

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt

      - name: Run behavior tests
        working-directory: ${{ matrix.suite.directory }}
        run: python -m pytest -q ${{ matrix.suite.target }}
